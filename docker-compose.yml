name: goldstack

x-java-service: &java-service
  restart: unless-stopped
  mem_limit: 420m
  depends_on: &deps
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy

x-common-env: &common-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${DB_USER:-goldstack}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  KAFKA_BOOTSTRAP: kafka:9092
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
  PRICE_SERVICE_URL: http://price-service:8080
  WALLET_SERVICE_URL: http://wallet-service:8080
  DEV_ENDPOINTS_ENABLED: ${DEV_ENDPOINTS_ENABLED:-true}
  ZIPKIN_URL: http://zipkin:9411/api/v2/spans

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${DB_USER:-goldstack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-goldstack} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "--save", ""]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    environment:
      KAFKA_CLUSTERS_0_NAME: goldstack
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: "-Xmx256m"
    ports:
      - "8089:8080"
    mem_limit: 400m
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  user-service:
    <<: *java-service
    build: { context: ./backend, args: { SERVICE: user-service } }
    image: goldstack-user-service:local
    environment: { <<: *common-env, DB_NAME: users_db }
    ports: ["8081:8080"]

  wallet-service:
    <<: *java-service
    build: { context: ./backend, args: { SERVICE: wallet-service } }
    image: goldstack-wallet-service:local
    environment: { <<: *common-env, DB_NAME: wallet_db }
    ports: ["8082:8080"]

  price-service:
    <<: *java-service
    build: { context: ./backend, args: { SERVICE: price-service } }
    image: goldstack-price-service:local
    environment: { <<: *common-env, DB_NAME: price_db, PRICE_PROVIDER: "${PRICE_PROVIDER:-simulator}", GOLD_API_KEY: "${GOLD_API_KEY:-}" }
    ports: ["8083:8080"]
    depends_on: { <<: *deps, redis: { condition: service_healthy } }

  order-service:
    <<: *java-service
    build: { context: ./backend, args: { SERVICE: order-service } }
    image: goldstack-order-service:local
    environment: { <<: *common-env, DB_NAME: order_db }
    ports: ["8084:8080"]
    depends_on: { <<: *deps, redis: { condition: service_healthy } }

  sip-service:
    <<: *java-service
    build: { context: ./backend, args: { SERVICE: sip-service } }
    image: goldstack-sip-service:local
    environment: { <<: *common-env, DB_NAME: sip_db }
    ports: ["8085:8080"]

  portfolio-service:
    <<: *java-service
    build: { context: ./backend, args: { SERVICE: portfolio-service } }
    image: goldstack-portfolio-service:local
    environment: { <<: *common-env, DB_NAME: portfolio_db }
    ports: ["8086:8080"]
    depends_on: { <<: *deps, redis: { condition: service_healthy } }

  notification-service:
    <<: *java-service
    build: { context: ./backend, args: { SERVICE: notification-service } }
    image: goldstack-notification-service:local
    environment: { <<: *common-env, DB_NAME: notification_db }
    ports: ["8087:8080"]

  api-gateway:
    build: { context: ./backend, args: { SERVICE: api-gateway } }
    image: goldstack-api-gateway:local
    environment:
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      USER_SERVICE_URL: http://user-service:8080
      WALLET_SERVICE_URL: http://wallet-service:8080
      PRICE_SERVICE_URL: http://price-service:8080
      ORDER_SERVICE_URL: http://order-service:8080
      SIP_SERVICE_URL: http://sip-service:8080
      PORTFOLIO_SERVICE_URL: http://portfolio-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
    ports:
      - "8080:8080"                 # the ONE public API address
    mem_limit: 420m
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: goldstack-frontend:local
    ports:
      - "3000:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    mem_limit: 256m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    mem_limit: 256m
    restart: unless-stopped

  zipkin:
    image: openzipkin/zipkin:3.5
    ports:
      - "9411:9411"
    mem_limit: 256m
    restart: unless-stopped

volumes:
  postgres-data:
