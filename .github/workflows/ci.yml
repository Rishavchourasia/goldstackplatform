name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test every module
        working-directory: backend
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    needs: [backend-tests, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - user-service
          - wallet-service
          - price-service
          - order-service
          - sip-service
          - portfolio-service
          - notification-service
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }} image
        run: docker build -f backend/Dockerfile --build-arg SERVICE=${{ matrix.service }} -t goldstack-${{ matrix.service }}:ci backend

  frontend-image:
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image
        run: docker build -t goldstack-frontend:ci frontend

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid (uses the example env file)
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Kubernetes manifests are valid
        run: |
          docker run --rm -v "$PWD/infra/k8s":/k8s ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-filename-pattern 'kind-cluster' -ignore-filename-pattern 'README' /k8s
