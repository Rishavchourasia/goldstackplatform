apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: goldstack
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: [sh, -c, "exec redis-server --requirepass \"$REDIS_PASSWORD\" --save ''"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: goldstack-secrets, key: REDIS_PASSWORD}}
          ports:
            - containerPort: 6379
          readinessProbe:
            exec: {command: [sh, -c, "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]}
            periodSeconds: 5
          resources:
            requests: {memory: 64Mi, cpu: 25m}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: goldstack
spec:
  selector: {app: redis}
  ports:
    - port: 6379
      targetPort: 6379
