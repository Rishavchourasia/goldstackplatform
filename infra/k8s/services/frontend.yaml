apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: goldstack
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      enableServiceLinks: false
      containers:
        - name: frontend
          image: goldstack-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
          resources:
            requests: {memory: 32Mi, cpu: 25m}
            limits: {memory: 96Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: goldstack
spec:
  selector: {app: frontend}
  ports:
    - port: 8080
      targetPort: 8080
