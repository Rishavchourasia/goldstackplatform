apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: goldstack
data:
  init-databases.sql: |
    -- =====================================================================
    -- One PostgreSQL SERVER, seven DATABASES: one per service.
    -- "Each service owns its own database": a service can only reach its
    -- own database (its JDBC URL names it), so nobody can join across
    -- service boundaries or quietly depend on another service's tables.
    -- In production each would usually be a separate server; locally one
    -- server keeps the laptop happy.
    --
    -- Runs automatically on a FRESH postgres volume
    -- (/docker-entrypoint-initdb.d). Idempotent: safe to run again by hand:
    --   docker compose exec -T postgres psql -U goldstack -d postgres < infra/postgres/init-databases.sql
    -- =====================================================================
    SELECT 'CREATE DATABASE ' || db
    FROM unnest(ARRAY['users_db', 'wallet_db', 'price_db', 'order_db', 'sip_db', 'portfolio_db', 'notification_db']) AS db
    WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = db)
    \gexec
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: goldstack
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: goldstack
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              valueFrom: {configMapKeyRef: {name: goldstack-config, key: DB_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: goldstack-secrets, key: DB_PASSWORD}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec: {command: [sh, -c, "pg_isready -U goldstack -d postgres"]}
            periodSeconds: 5
          resources:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 320Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
        - name: init
          configMap: {name: postgres-init}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: goldstack
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
      targetPort: 5432
