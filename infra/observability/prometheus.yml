global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: goldstack-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - user-service:8080
          - wallet-service:8080
          - price-service:8080
          - order-service:8080
          - sip-service:8080
          - portfolio-service:8080
          - notification-service:8080
