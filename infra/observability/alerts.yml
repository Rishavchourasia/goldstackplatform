groups:
  - name: goldstack-ledger
    rules:
      - alert: CoinLedgerOutOfBalance
        expr: goldstack_ledger_imbalance > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Coin ledger does not balance"
          description: "The reconciliation job found {{ $value }} unbalanced entries in wallet-service."

  - name: goldstack-services
    rules:
      - alert: ServiceDown
        expr: up{job="goldstack-services"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} is down"
